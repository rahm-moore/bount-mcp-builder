version: "3.9"

# Production overlay. Use with:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# In production, MCP_SECRETS_BACKEND is switched to "vault" and the
# secrets/ bind-mount is removed — credential_resolver.py / .ts instead
# call out to the org's secrets manager (Vault / AWS Secrets Manager) at
# runtime. No plaintext secrets are ever placed in these images.

services:
  aep-core:
    restart: unless-stopped
    environment:
      - MCP_SECRETS_BACKEND=vault
    volumes: []

  site-crawler:
    restart: unless-stopped
    environment:
      - MCP_SECRETS_BACKEND=vault
    volumes: []

  industry-news-tracker:
    restart: unless-stopped

  orchestrator:
    restart: unless-stopped

  web-ui-backend:
    restart: unless-stopped

  web-ui-frontend:
    restart: unless-stopped
