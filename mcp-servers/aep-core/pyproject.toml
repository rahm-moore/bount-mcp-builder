[project]
name = "aep-core"
version = "0.1.0"
description = "MCP server exposing the full Adobe Experience Platform (AEP) API surface: auth, Flow Service (dataflows/datastreams), Schema Registry, Catalog, Segmentation, Identity, Governance, Sandboxes."
requires-python = ">=3.11"
dependencies = [
    # Pinned below 2.0: 2.0.0 restructured mcp.server.fastmcp into a
    # different API (mcp.server.mcpserver.MCPServer) that this codebase
    # does not use. Revisit this pin deliberately if/when migrating.
    "mcp>=1.9.0,<2.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
